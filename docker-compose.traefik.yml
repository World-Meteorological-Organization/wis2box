services:
  web-proxy:
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.wis2box.rule=Host(`${WIS2BOX_HOST}`)"
    - "traefik.http.routers.wis2box.entrypoints=websecure"
    - "traefik.http.routers.wis2box.tls.certresolver=myresolver"
    - "traefik.http.services.wis2box.loadbalancer.server.port=80"
    
  traefik:
    container_name: traefik
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtts.address=:8883
      - --providers.docker=true
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - 80:80
      - 443:443
      - 8883:8883
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  mosquitto:
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.mqtts.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.mqtts.entrypoints=mqtts"
      - "traefik.tcp.routers.mqtts.tls=true"
      - "traefik.tcp.routers.mqtts.tls.certresolver=myresolver"
      - "traefik.tcp.routers.mqtts.service=mosquitto-mqtt"
      - "traefik.tcp.services.mosquitto-mqtt.loadbalancer.server.port=1883"

volumes:
  traefik-letsencrypt:
